[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anime-analytics-api"
version = "0.1.0"
description = "Anime analytics REST API built with FastAPI and Pandas"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pandas",
    "numpy",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anime_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
