
site_name: Anime Analytics API
site_description: Technical documentation for the Anime Analytics API
site_url: https://sunilnarayan419-ui.github.io/Anime-Analytics-API/
repo_url: https://github.com/sunilnarayan419-ui/Anime-Analytics-API
repo_name: sunilnarayan419-ui/Anime-Analytics-API

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - API Reference: api-reference.md
  - Architecture: architecture.md
  - Analytics:
      - Methodology: analytical_methodology.md
      - Data Dictionary: data_dictionary.md
  - Development: development.md
